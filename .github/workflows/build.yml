name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Install the scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install the Bicep CLI
        run: az bicep install

      - name: Compile the templates
        run: |
          set -o pipefail
          # Le linter écrit sur la sortie d'erreur. Tout ce qui n'est pas une
          # ligne d'information sur la configuration arrête l'étape.
          for modele in BicepOneCommerce/main.bicep BicepAzureServiceBus/main.bicep; do
            az bicep build --file "$modele" --stdout > /dev/null 2> "$RUNNER_TEMP/diagnostics.txt"
            grep -v 'Info Bicep Linter Configuration' "$RUNNER_TEMP/diagnostics.txt"               | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/restants.txt" || true
            if [ -s "$RUNNER_TEMP/restants.txt" ]; then
              echo "$modele ne compile pas proprement :"
              cat "$RUNNER_TEMP/restants.txt"
              exit 1
            fi
            echo "$modele compile sans diagnostic."
          done

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"Arthure-code_onecommerce-microservices" \
            /o:"arthuredevsecops" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs,One.AppHost/**,One.ServiceDefaults/**"
          dotnet build OneCommerce.sln --no-incremental
          dotnet test OneCommerce.sln --no-build \
            --collect:"XPlat Code Coverage;Format=opencover"
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
